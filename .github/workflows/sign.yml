name: Sign manifests
on:
  push:
    paths:
      - 'licenses.json'
      - 'fba.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sign
        env:
          LICENSE_PRIVATE_KEY: ${{ secrets.LICENSE_PRIVATE_KEY }}
        run: node sign.mjs

      - name: Commit signatures
        run: |
          git config user.name "license-bot"
          git config user.email "bot@example.com"
          # 逐个 add：某个 .sig 还不存在时不要影响另一个
          git add licenses.json.sig 2>/dev/null || true
          git add fba.json.sig 2>/dev/null || true
          git diff --cached --quiet || git commit -m "update signature"
          git push
